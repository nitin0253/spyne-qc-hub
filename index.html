<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Spyne · QC Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',sans-serif;background:#111113;color:#f0efe9;-webkit-font-smoothing:antialiased;}
button{font-family:'Inter',sans-serif;cursor:pointer;border:none;background:none;}

/* ── SHELL ── */
.shell{display:flex;flex-direction:column;height:100vh;}

/* ── HEADER ── */
.hdr{
  display:flex;align-items:center;justify-content:center;
  height:52px;flex-shrink:0;
  background:#1c1c1f;
  border-bottom:1px solid #2a2a2f;
  position:relative;z-index:10;
}

/* ── TABS ── */
.tabs{display:flex;align-items:center;gap:4px;}

.tab{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 22px;border-radius:8px;
  font-size:13px;font-weight:600;letter-spacing:-.01em;
  color:#76767e;
  border:1px solid transparent;
  transition:color .15s,background .15s,border-color .15s;
  text-decoration:none;
  position:relative;
}
.tab:hover{color:#f0efe9;background:rgba(107,158,255,.06);}
.tab.active{
  color:#6b9eff;
  background:rgba(107,158,255,.12);
  border-color:rgba(107,158,255,.3);
}
.tab-icon{font-size:15px;line-height:1;}
.tab-dot{
  width:6px;height:6px;border-radius:50%;
  background:#4ade80;box-shadow:0 0 6px #4ade80;
  animation:pulse 2s ease infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.75)}}
.tab-badge{
  font-family:'JetBrains Mono',monospace;
  font-size:8px;font-weight:700;letter-spacing:.4px;
  background:rgba(245,194,101,.15);
  border:1px solid rgba(245,194,101,.3);
  color:#f5c265;padding:2px 7px;border-radius:99px;
}

/* ── IFRAME ── */
.frame-wrap{flex:1;position:relative;overflow:hidden;}
iframe{
  position:absolute;inset:0;
  width:100%;height:100%;
  border:none;display:block;
  background:#111113;
}

/* ── COMING SOON ── */
.soon{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;background:#111113;
}
.soon-icon{font-size:52px;}
.soon-title{font-size:20px;font-weight:700;letter-spacing:-.3px;}
.soon-sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:#76767e;letter-spacing:.5px;}
.soon-badge{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 16px;border-radius:99px;margin-top:4px;
  background:rgba(245,194,101,.08);border:1px solid rgba(245,194,101,.25);
  font-family:'JetBrains Mono',monospace;font-size:11px;color:#f5c265;letter-spacing:.4px;
}
</style>
</head>
<body>
<div class="shell">

  <header class="hdr">
    <nav class="tabs" id="tabs">
      <button class="tab active" data-id="images" onclick="activate('images')">
        <span class="tab-icon">🖼️</span> Images <span class="tab-dot"></span>
      </button>
      <button class="tab" data-id="videos" onclick="activate('videos')">
        <span class="tab-icon">🎬</span> Videos <span class="tab-dot"></span>
      </button>
      <button class="tab" data-id="360" onclick="activate('360')">
        <span class="tab-icon">🔄</span> 360° <span class="tab-dot"></span>
      </button>
    </nav>
  </header>

  <div class="frame-wrap" id="frameWrap">

    <!-- Images — load immediately -->
    <iframe
      id="f-images"
      src="https://vin-tracker-delivery.vercel.app/"
      title="Images QC Dashboard"
      allow="clipboard-write; clipboard-read"
    ></iframe>

    <!-- Videos — hidden until activated, src set by JS to avoid X-Frame-Options block -->
    <iframe
      id="f-videos"
      src="about:blank"
      title="Videos QC Dashboard"
      allow="clipboard-write; clipboard-read"
      style="display:none;"
    ></iframe>

    <!-- 360 — hidden until activated, src set by JS -->
    <iframe
      id="f-360"
      src="about:blank"
      title="360° QC Dashboard"
      allow="clipboard-write; clipboard-read"
      style="display:none;"
    ></iframe>

  </div>
</div>

<script>
const URLS = {
  images: 'https://vin-tracker-delivery.vercel.app/',
  videos: 'https://video-tracker-delivery.vercel.app/',
  '360':  'https://360-qc-pendency.vercel.app/',
};

// Track which iframes have been loaded (to avoid reloading on re-visit)
const loaded = { images: true, videos: false, '360': false };

function activate(id) {
  // Update tab styles
  document.querySelectorAll('.tab').forEach(b =>
    b.classList.toggle('active', b.dataset.id === id)
  );

  // Show/hide frames
  ['images','videos','360'].forEach(key => {
    const el = document.getElementById('f-' + key);
    if (!el) return;
    el.style.display = key === id ? 'block' : 'none';
  });

  // Lazy-load iframe: set src the first time it becomes active
  const frame = document.getElementById('f-' + id);
  if (frame && frame.tagName === 'IFRAME' && !loaded[id] && URLS[id]) {
    frame.src = URLS[id];
    loaded[id] = true;
  }

  // Persist
  try { localStorage.setItem('qc-hub-tab', id); } catch(e) {}
}

// Restore last active tab on load
try {
  const last = localStorage.getItem('qc-hub-tab');
  if (last && last !== 'images') activate(last);
} catch(e) {}
</script>
</body>
</html>
