<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Spyne Ops · QC Dashboard Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--f:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;}
[data-theme="dark"]{
  --bg:#111113;--surface:#1c1c1f;--rim:#2a2a2f;--rim2:#34343a;
  --t1:#f0efe9;--t2:#b0b0b8;--t3:#76767e;
  --accent:#6b9eff;--ag:rgba(107,158,255,.12);--ag2:rgba(107,158,255,.06);
  --green:#4ade80;--amber:#f5c265;--red:#f87171;--purple:#c084fc;
  --sh:0 2px 8px rgba(0,0,0,.4);--sh2:0 8px 32px rgba(0,0,0,.6);
}
[data-theme="light"]{
  --bg:#f4f5fa;--surface:#ffffff;--rim:#dde1f0;--rim2:#c8ceea;
  --t1:#090c1a;--t2:#3d4568;--t3:#9097be;
  --accent:#3a5cf0;--ag:rgba(58,92,240,.1);--ag2:rgba(58,92,240,.05);
  --green:#1f7a52;--amber:#b27a00;--red:#b3261e;--purple:#7c3aed;
  --sh:0 1px 4px rgba(0,0,0,.08);--sh2:0 8px 24px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:var(--f);background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased;}
button{font-family:var(--f);cursor:pointer;border:none;background:none}

/* ── HEADER ── */
.hdr{
  display:flex;align-items:center;gap:16px;
  padding:0 24px;height:56px;
  background:var(--surface);border-bottom:1px solid var(--rim);
  position:relative;z-index:10;flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.brand-logo{
  height:30px;width:auto;
  background:#5c7cfa;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  padding:0 10px;
  font-size:13px;font-weight:800;color:#fff;letter-spacing:.5px;
}
.brand-label{font-size:14px;font-weight:700;letter-spacing:-.3px;}
.brand-sub{font-family:var(--mono);font-size:9px;color:var(--t3);letter-spacing:1.5px;margin-top:1px;}

/* ── TAB SWITCHER ── */
.tabs{display:flex;align-items:center;gap:4px;margin-left:auto;}
.tab{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 18px;border-radius:8px;
  font-size:13px;font-weight:600;letter-spacing:-.01em;
  color:var(--t2);transition:all .18s;
  border:1px solid transparent;
  position:relative;
}
.tab:hover{color:var(--t1);background:var(--ag2);}
.tab.active{
  color:var(--accent);background:var(--ag);
  border-color:rgba(107,158,255,.25);
}
[data-theme="light"] .tab.active{border-color:rgba(58,92,240,.2);}
.tab-icon{font-size:16px;line-height:1;}
.tab-badge{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--amber);color:#000;
  font-family:var(--mono);font-size:8px;font-weight:700;
  padding:1px 6px;border-radius:99px;letter-spacing:.3px;
  opacity:.85;
}
.tab-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--green);box-shadow:0 0 6px var(--green);
  animation:pulse 2s ease infinite;flex-shrink:0;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.75)}}

/* ── THEME TOGGLE ── */
.theme-btn{
  width:34px;height:34px;border-radius:8px;
  border:1px solid var(--rim);background:var(--surface);
  color:var(--t2);display:grid;place-items:center;
  font-size:15px;transition:all .15s;margin-left:8px;
}
.theme-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--ag2);}

/* ── IFRAME WRAPPER ── */
.frames{flex:1;position:relative;overflow:hidden;}
.frame{
  position:absolute;inset:0;
  border:none;width:100%;height:100%;
  display:none;
  background:var(--bg);
}
.frame.active{display:block;}

/* ── COMING SOON PLACEHOLDER ── */
.coming-soon{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;background:var(--bg);
}
.cs-icon{font-size:56px;line-height:1;}
.cs-title{font-size:22px;font-weight:700;letter-spacing:-.4px;color:var(--t1);}
.cs-sub{font-family:var(--mono);font-size:12px;color:var(--t3);letter-spacing:.5px;}
.cs-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 16px;border-radius:99px;
  background:rgba(245,194,101,.1);border:1px solid rgba(245,194,101,.3);
  font-family:var(--mono);font-size:11px;color:var(--amber);
  margin-top:4px;letter-spacing:.5px;
}

/* ── LAYOUT ── */
.shell{display:flex;flex-direction:column;height:100vh;}
</style>
</head>
<body>
<div class="shell">

  <!-- Header -->
  <header class="hdr">
    <div class="brand">
      <div class="brand-logo">SPYNE</div>
      <div>
        <div class="brand-label">QC Dashboard</div>
        <div class="brand-sub">OPS HUB</div>
      </div>
    </div>

    <!-- Product tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="images" onclick="switchTab('images')">
        <span class="tab-icon">🖼️</span>
        Images
        <span class="tab-dot"></span>
      </button>
      <button class="tab" data-tab="videos" onclick="switchTab('videos')">
        <span class="tab-icon">🎬</span>
        Videos
        <span class="tab-dot"></span>
      </button>
      <button class="tab" data-tab="360" onclick="switchTab('360')">
        <span class="tab-icon">🔄</span>
        360°
        <span class="tab-badge">SOON</span>
      </button>
    </div>

    <!-- Theme toggle -->
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle theme">🌙</button>
  </header>

  <!-- Frames -->
  <div class="frames">

    <!-- Images -->
    <iframe
      class="frame active"
      id="frame-images"
      src="https://vin-tracker-delivery.vercel.app/"
      title="Images QC Dashboard"
      allow="clipboard-write"
    ></iframe>

    <!-- Videos -->
    <iframe
      class="frame"
      id="frame-videos"
      src=""
      data-src="https://video-tracker-delivery.vercel.app/"
      title="Videos QC Dashboard"
      allow="clipboard-write"
    ></iframe>

    <!-- 360 — coming soon -->
    <div class="frame" id="frame-360">
      <div class="coming-soon">
        <div class="cs-icon">🔄</div>
        <div class="cs-title">360° Dashboard</div>
        <div class="cs-sub">IN PROGRESS</div>
        <div class="cs-badge">🚧 Coming soon — check back later</div>
      </div>
    </div>

  </div>
</div>

<script>
// ── THEME ────────────────────────────────────────────────────────
const saved = localStorage.getItem('hub-theme') || 'dark';
applyTheme(saved);

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = t === 'dark' ? '🌙' : '☀️';
  try { localStorage.setItem('hub-theme', t); } catch(e) {}
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}

// ── TAB SWITCHING ────────────────────────────────────────────────
// Lazy-load iframes: only set src when first activated, so unused
// dashboards don't consume bandwidth on load.
function switchTab(id) {
  // Update tab buttons
  document.querySelectorAll('.tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === id);
  });

  // Show correct frame
  document.querySelectorAll('.frame').forEach(f => {
    f.classList.toggle('active', f.id === 'frame-' + id);
  });

  // Lazy-load iframe src on first visit
  const frame = document.getElementById('frame-' + id);
  if (frame && frame.tagName === 'IFRAME' && !frame.src && frame.dataset.src) {
    frame.src = frame.dataset.src;
  }

  // Persist active tab
  try { localStorage.setItem('hub-tab', id); } catch(e) {}
}

// ── RESTORE LAST TAB ─────────────────────────────────────────────
const lastTab = localStorage.getItem('hub-tab');
if (lastTab && lastTab !== 'images') {
  switchTab(lastTab);
}
</script>
</body>
</html>
